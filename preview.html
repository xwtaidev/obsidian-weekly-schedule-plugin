<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<title>Weekly Schedule — 布局预览</title>
<style>
	/* ============================================================
	   Obsidian theme tokens, copied from the app's own stylesheet
	   (obsidian.asar) so this preview matches the real pane.
	   ============================================================ */
	[data-theme="dark"] {
		--background-primary: #1e1e1e;
		--background-primary-alt: #1a1a1a;
		--background-secondary: #161616;
		--background-modifier-border: #333333;
		--background-modifier-border-hover: #4a4a4a;
		--background-modifier-hover: rgba(255, 255, 255, 0.055);
		--text-normal: #dcddde;
		--text-muted: #b3b3b3;
		--text-faint: #7a7a7a;
		--text-accent: #7f6df2;
		--interactive-accent: #7f6df2;

		/* Solved against #1e1e1e: labels 4.5:1, rails 3.6:1+. */
		--ws-q1: #b6575f;  --ws-q1-label: #c06e75;
		--ws-q2: #8a6dbb;  --ws-q2-label: #9378c0;
		--ws-q3: #4f81b8;  --ws-q3-label: #5a89bc;
		--ws-q4: #7d8188;  --ws-q4-label: #82858c;
	}
	[data-theme="light"] {
		--background-primary: #ffffff;
		--background-primary-alt: #fafafa;
		--background-secondary: #f5f6f8;
		--background-modifier-border: #e0e0e0;
		--background-modifier-border-hover: #c9c9c9;
		--background-modifier-hover: rgba(0, 0, 0, 0.045);
		--text-normal: #2e3338;
		--text-muted: #6b6b6b;
		--text-faint: #767676;
		--text-accent: #5b4fd6;
		--interactive-accent: #5b4fd6;

		/* Solved against #ffffff: labels 4.5:1, rails 3.9:1+. */
		--ws-q1: #b6575f;  --ws-q1-label: #b6575f;
		--ws-q2: #8a6dbb;  --ws-q2-label: #8469b4;
		--ws-q3: #4f81b8;  --ws-q3-label: #4a79ad;
		--ws-q4: #7d8188;  --ws-q4-label: #73777d;
	}

	* { box-sizing: border-box; }

	body {
		margin: 0;
		padding: 24px;
		background: var(--background-secondary);
		color: var(--text-normal);
		font-family: -apple-system, "SF Pro Text", "PingFang SC", sans-serif;
		font-size: 15px;
	}

	.theme-switch {
		display: flex;
		gap: 8px;
		margin-bottom: 16px;
		font-size: 13px;
	}
	.theme-switch button {
		padding: 4px 12px;
		border: 1px solid var(--background-modifier-border);
		border-radius: 6px;
		background: transparent;
		color: var(--text-muted);
		cursor: pointer;
	}
	.theme-switch button[aria-pressed="true"] {
		border-color: var(--interactive-accent);
		color: var(--text-normal);
	}

	/* The real pane: Obsidian already supplies the background. */
	.weekly-schedule-container {
		background: var(--background-primary);
		border: 1px solid var(--background-modifier-border);
		border-radius: 10px;
		overflow: hidden;

		--ws-gap: 32px;
		--ws-row-gap: 48px;
	}

	/* ============================== toolbar ============================== */

	.weekly-schedule-toolbar {
		display: flex;
		align-items: center;
		justify-content: space-between;
		gap: 12px;
		flex-wrap: wrap;
		padding: 10px 18px;
		border-bottom: 1px solid var(--background-modifier-border);
	}

	.weekly-schedule-nav,
	.weekly-schedule-actions {
		display: flex;
		align-items: center;
		gap: 4px;
	}

	.weekly-schedule-week-label {
		font-size: 14px;
		font-weight: 600;
		letter-spacing: -0.01em;
		padding: 0 8px;
	}

	.weekly-schedule-button,
	.weekly-schedule-text-button {
		display: inline-flex;
		align-items: center;
		justify-content: center;
		height: 28px;
		min-width: 28px;
		padding: 0 8px;
		border: 0;
		border-radius: 6px;
		background: transparent;
		color: var(--text-muted);
		cursor: pointer;
		transition: transform 120ms cubic-bezier(0.16, 1, 0.3, 1),
			background-color 120ms ease, color 120ms ease;
	}
	.weekly-schedule-text-button { font-size: 13px; }
	.weekly-schedule-button:hover,
	.weekly-schedule-text-button:hover {
		background: var(--background-modifier-hover);
		color: var(--text-normal);
	}
	/* Tactile press, replacing shadows as the affordance. */
	.weekly-schedule-button:active,
	.weekly-schedule-text-button:active,
	.weekly-schedule-add:active { transform: scale(0.97); }

	/* ============================== board =============================== */

	/* 3 days per row, 3 rows. The 7th day takes one column of the last row
	   and the remaining space stays empty. */
	.weekly-schedule-board {
		display: grid;
		grid-template-columns: repeat(3, minmax(0, 1fr));
		column-gap: var(--ws-gap);
		row-gap: var(--ws-row-gap);
		align-items: start;
		padding: 18px;
	}

	.weekly-schedule-day {
		display: flex;
		flex-direction: column;
		min-width: 0;
	}

	/* Header carries the day identity; the rule below it is the only divider,
	   so no card wrapper is needed. */
	.weekly-schedule-day-header {
		display: flex;
		align-items: baseline;
		gap: 8px;
		padding-bottom: 7px;
		border-bottom: 1px solid var(--background-modifier-border);
	}
	.weekly-schedule-day-name {
		font-size: 14px;
		font-weight: 600;
		letter-spacing: -0.01em;
	}
	.weekly-schedule-day-date {
		font-size: 12px;
		font-variant-numeric: tabular-nums;
		color: var(--text-faint);
	}
	.weekly-schedule-day-count {
		margin-left: auto;
		font-size: 11px;
		font-variant-numeric: tabular-nums;
		color: var(--text-faint);
	}
	/* Today: one accent underline, no fill. */
	.weekly-schedule-day.is-today .weekly-schedule-day-header {
		border-bottom-color: var(--interactive-accent);
	}
	.weekly-schedule-day.is-today .weekly-schedule-day-name { color: var(--text-accent); }

	/* ============================== cells =============================== */

	/* Quadrants stack vertically. The accent is a 2px rail plus a tinted
	   header — no solid colour blocks, no borders around the task list. */
	.weekly-schedule-cells {
		display: flex;
		flex-direction: column;
	}

	.weekly-schedule-cell {
		display: flex;
		flex-direction: column;
		border-left: 2px solid var(--ws-accent);
		padding-left: 10px;
		margin-top: 14px;
	}

	.weekly-schedule-cell-q1 { --ws-accent: var(--ws-q1); --ws-accent-label: var(--ws-q1-label); }
	.weekly-schedule-cell-q2 { --ws-accent: var(--ws-q2); --ws-accent-label: var(--ws-q2-label); }
	.weekly-schedule-cell-q3 { --ws-accent: var(--ws-q3); --ws-accent-label: var(--ws-q3-label); }
	.weekly-schedule-cell-q4 { --ws-accent: var(--ws-q4); --ws-accent-label: var(--ws-q4-label); }

	.weekly-schedule-cell-header {
		display: flex;
		align-items: center;
		gap: 5px;
		font-size: 11px;
		line-height: 1.4;
	}
	.weekly-schedule-cell-label {
		color: var(--ws-accent-label);
		font-weight: 600;
		white-space: nowrap;
	}
	.weekly-schedule-cell-sep { color: var(--text-faint); }

	/* ============================== tasks =============================== */

	.weekly-schedule-list {
		display: flex;
		flex-direction: column;
		margin-top: 5px;
	}

	.weekly-schedule-task {
		display: flex;
		align-items: flex-start;
		gap: 7px;
		padding: 4px 6px 4px 4px;
		border-radius: 4px;
		transition: background-color 120ms ease;
	}
	.weekly-schedule-task:hover { background: var(--background-modifier-hover); }

	.weekly-schedule-checkbox {
		flex: 0 0 auto;
		width: 13px;
		height: 13px;
		margin: 3px 0 0;
		appearance: none;
		border: 1.5px solid var(--background-modifier-border-hover);
		border-radius: 4px;
		background: transparent;
		cursor: pointer;
		transition: border-color 120ms ease, background-color 120ms ease;
	}
	.weekly-schedule-checkbox:hover { border-color: var(--ws-accent); }
	.weekly-schedule-checkbox:checked {
		border-color: var(--ws-accent);
		background: var(--ws-accent);
		background-image: url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='white' stroke-width='3.5' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M20 6 9 17l-5-5'/%3E%3C/svg%3E");
		background-size: 9px;
		background-position: center;
		background-repeat: no-repeat;
	}

	.weekly-schedule-task-text {
		flex: 1 1 auto;
		min-width: 0;
		font-size: 13px;
		line-height: 1.5;
		overflow-wrap: anywhere;
	}
	.weekly-schedule-task.is-done .weekly-schedule-task-text {
		color: var(--text-faint);
		text-decoration: line-through;
		text-decoration-color: var(--background-modifier-border-hover);
	}

	/* Row controls: hidden until hover, no layout shift. */
	.weekly-schedule-task-controls {
		display: flex;
		gap: 1px;
		flex: 0 0 auto;
		opacity: 0;
		transition: opacity 120ms ease;
	}
	.weekly-schedule-task:hover .weekly-schedule-task-controls { opacity: 1; }
	.weekly-schedule-task-button {
		width: 18px;
		height: 18px;
		padding: 0;
		border: 0;
		border-radius: 4px;
		background: transparent;
		color: var(--text-faint);
		cursor: pointer;
		font-size: 11px;
		line-height: 1;
	}
	.weekly-schedule-task-button:hover {
		background: var(--background-modifier-hover);
		color: var(--text-normal);
	}

	/* Empty state: a quiet hint, not a dashed placeholder box. */
	.weekly-schedule-empty {
		padding: 2px 0 2px 4px;
		font-size: 12px;
		color: var(--text-faint);
	}

	/* ============================== add ================================= */

	/* Text-weight affordance instead of a bordered button box. */
	.weekly-schedule-add {
		display: flex;
		align-items: center;
		gap: 5px;
		width: 100%;
		margin-top: 5px;
		padding: 4px;
		border: 0;
		border-radius: 4px;
		background: transparent;
		color: var(--text-faint);
		font: inherit;
		font-size: 12px;
		text-align: start;
		cursor: pointer;
		transition: color 120ms ease, background-color 120ms ease;
	}
	.weekly-schedule-add:hover {
		background: var(--background-modifier-hover);
		color: var(--text-normal);
	}
	.weekly-schedule-add-icon { font-weight: 600; }
	.weekly-schedule-add-label { flex: 1 1 auto; }
	.weekly-schedule-add-hint { letter-spacing: 2px; opacity: 0.6; }

	@media (max-width: 900px) {
		.weekly-schedule-board { grid-template-columns: repeat(2, minmax(0, 1fr)); }
	}
	@media (max-width: 560px) {
		.weekly-schedule-board { grid-template-columns: minmax(0, 1fr); }
	}
</style>
</head>
<body>

<div class="theme-switch">
	<button id="dark" aria-pressed="true">深色主题</button>
	<button id="light" aria-pressed="false">浅色主题</button>
</div>

<div class="weekly-schedule-container">
	<div class="weekly-schedule-toolbar">
		<div class="weekly-schedule-nav">
			<button class="weekly-schedule-button" aria-label="上一周">‹</button>
			<span class="weekly-schedule-week-label">2026 年第 12 周 · 3月16日 – 3月22日</span>
			<button class="weekly-schedule-button" aria-label="下一周">›</button>
		</div>
		<div class="weekly-schedule-actions">
			<button class="weekly-schedule-text-button">本周</button>
			<button class="weekly-schedule-button" aria-label="隐藏已完成">◉</button>
			<button class="weekly-schedule-button" aria-label="打开所在笔记">▤</button>
		</div>
	</div>

	<div class="weekly-schedule-board" id="board"></div>
</div>

<script>
const DAYS = [
	{ name: '周一', date: '3/16' },
	{ name: '周二', date: '3/17' },
	{ name: '周三', date: '3/18', today: true },
	{ name: '周四', date: '3/19' },
	{ name: '周五', date: '3/20' },
	{ name: '周六', date: '3/21' },
	{ name: '周日', date: '3/22' },
];

const QUADRANTS = [
	{ id: 'q1', important: '重要', urgent: '紧急' },
	{ id: 'q2', important: '不重要', urgent: '紧急' },
	{ id: 'q3', important: '重要', urgent: '不紧急' },
	{ id: 'q4', important: '不重要', urgent: '不紧急' },
];

// Content mirrors the reference screenshot, including its one real task.
const TASKS = {
	'3-q3': [
		{ text: '16:30-18:00，服务端周例会', done: false },
	],
	'4-q3': [
		{ text: '16:30-18:00，项目周例会', done: false },
	],
	'2-q1': [
		{ text: '交周报', done: true },
		{ text: '修复线上分页错位', done: false },
	],
	'0-q2': [
		{ text: '回复客户邮件', done: false },
	],
	'5-q4': [
		{ text: '整理书签', done: false },
		{ text: '备份照片', done: true },
	],
};

const board = document.getElementById('board');

DAYS.forEach((day, index) => {
	const dayEl = document.createElement('section');
	dayEl.className = 'weekly-schedule-day' + (day.today ? ' is-today' : '');

	const total = QUADRANTS.reduce((n, q) => n + (TASKS[`${index}-${q.id}`] || []).length, 0);

	const header = document.createElement('div');
	header.className = 'weekly-schedule-day-header';
	header.innerHTML = `
		<span class="weekly-schedule-day-name">${day.name}</span>
		<span class="weekly-schedule-day-date">${day.date}</span>
		<span class="weekly-schedule-day-count">${total ? total + ' 项' : ''}</span>`;
	dayEl.append(header);

	const cells = document.createElement('div');
	cells.className = 'weekly-schedule-cells';

	for (const q of QUADRANTS) {
		const tasks = TASKS[`${index}-${q.id}`] || [];
		const cell = document.createElement('div');
		cell.className = `weekly-schedule-cell weekly-schedule-cell-${q.id}`;
		cell.innerHTML = `
			<div class="weekly-schedule-cell-header">
				<span class="weekly-schedule-cell-label">${q.important}</span>
				<span class="weekly-schedule-cell-sep">·</span>
				<span class="weekly-schedule-cell-label">${q.urgent}</span>
			</div>`;

		if (tasks.length === 0) cell.classList.add('is-empty');
		const list = document.createElement('div');
		list.className = 'weekly-schedule-list';
		for (const task of tasks) {
			const row = document.createElement('div');
			row.className = 'weekly-schedule-task' + (task.done ? ' is-done' : '');
			row.innerHTML = `
				<input type="checkbox" class="weekly-schedule-checkbox" ${task.done ? 'checked' : ''}>
				<div class="weekly-schedule-task-text">${task.text}</div>
				<div class="weekly-schedule-task-controls">
					<button class="weekly-schedule-task-button" aria-label="上移">↑</button>
					<button class="weekly-schedule-task-button" aria-label="下移">↓</button>
					<button class="weekly-schedule-task-button" aria-label="删除">×</button>
				</div>`;
			list.append(row);
		}
		cell.append(list);

		const add = document.createElement('button');
		add.className = 'weekly-schedule-add';
		add.innerHTML = `
			<span class="weekly-schedule-add-icon">+</span>
			<span class="weekly-schedule-add-label">添加一个待办事项</span>
			<span class="weekly-schedule-add-hint">↑ ↓</span>`;
		cell.append(add);

		cells.append(cell);
	}

	dayEl.append(cells);
	board.append(dayEl);
});

for (const id of ['dark', 'light']) {
	document.getElementById(id).addEventListener('click', () => {
		document.documentElement.dataset.theme = id;
		for (const other of ['dark', 'light']) {
			document.getElementById(other).setAttribute('aria-pressed', String(other === id));
		}
	});
}
</script>
</body>
</html>
